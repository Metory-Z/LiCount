name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 锁定具体版本，避免 ubuntu-latest 漂移后构建环境突变
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, relying on preinstalled SDK"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate code
        run: ./gradlew compileDebugKotlin testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ---- 以下步骤需要签名密钥；未配置 Secrets 时安全跳过 ----

      - name: Check signing secrets
        id: check_sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置签名密钥，跳过 release 签名与发布（debug APK 仍会上传）"
          fi

      - name: Restore signing key
        if: steps.check_sign.outputs.has_sign == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/qingzhang.jks"

      - name: Build release APK
        if: steps.check_sign.outputs.has_sign == 'true'
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/qingzhang.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify signing certificate
        if: steps.check_sign.outputs.has_sign == 'true'
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Remove restored key
        if: always()
        run: rm -f "$RUNNER_TEMP/qingzhang.jks"

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: QingZhang-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name != 'pull_request' && steps.check_sign.outputs.has_sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: QingZhang-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_sign.outputs.has_sign == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
