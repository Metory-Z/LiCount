name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 锁定具体版本，避免 ubuntu-latest 漂移后构建环境突变
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, relying on preinstalled SDK"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---- 签名密钥：集中注入到 GITHUB_ENV，后续所有 Gradle 步骤共用同一把密钥 ----
      # debug 与 release 都用固定签名，保证任意两次出包都能直接覆盖安装。

      - name: Check signing secrets
        id: check_sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置签名密钥，跳过 release 签名与发布（debug APK 仍会上传）"
          fi

      - name: Restore signing key
        if: steps.check_sign.outputs.has_sign == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/licount.jks"
          {
            echo "SIGNING_KEY_PATH=$RUNNER_TEMP/licount.jks"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_STORE_PASSWORD=$KEY_STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate code
        run: ./gradlew compileDebugKotlin testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: steps.check_sign.outputs.has_sign == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signing certificate
        if: steps.check_sign.outputs.has_sign == 'true'
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          echo "=== debug 与 release 证书指纹（应完全一致）==="
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/app-release.apk; do
            echo "--- $apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | grep -i "SHA-256"
          done
          echo "=== 包名（应完全一致）==="
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/app-release.apk; do
            echo -n "$(basename "$apk"): "
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" 2>/dev/null | head -1 || true
          done

      - name: Rename release APK
        if: steps.check_sign.outputs.has_sign == 'true'
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/LiCount-${{ github.ref_name }}.apk"

      - name: Remove restored key
        if: always()
        run: rm -f "$RUNNER_TEMP/licount.jks"

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: LiCount-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name != 'pull_request' && steps.check_sign.outputs.has_sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: LiCount-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_sign.outputs.has_sign == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
